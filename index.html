<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Papo Pistola: latest videos</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --line: #e2e0da; --accent: #c8321f; --accent-text: #ffffff; --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16161a; --card: #1f1f25; --text: #f1f0ee; --muted: #9a9aa3; --line: #2e2e36; --accent: #ff6a55; --accent-text: #16161a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .widget { max-width: 960px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  h1 { font-size: 1.25rem; margin: 0; }
  header a { color: var(--accent); font-size: .9rem; text-decoration: none; }
  header a:hover, header a:focus-visible { text-decoration: underline; }

  .stage { position: relative; }
  .track { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory;
           scroll-behavior: smooth; scrollbar-width: none; padding: 2px; }
  .track::-webkit-scrollbar { display: none; }
  @media (prefers-reduced-motion: reduce) { .track { scroll-behavior: auto; } }

  .slide { flex: 0 0 100%; scroll-snap-align: start; }
  @media (min-width: 640px)  { .slide { flex-basis: calc((100% - 16px) / 2); } }
  @media (min-width: 900px)  { .slide { flex-basis: calc((100% - 32px) / 3); } }

  .video { display: block; background: var(--card); border: 1px solid var(--line);
           border-radius: var(--radius); overflow: hidden; color: inherit; text-decoration: none; height: 100%; }
  .video:hover, .video:focus-visible { border-color: var(--accent); outline: none; }
  .thumb { aspect-ratio: 16 / 9; width: 100%; display: block; object-fit: cover; background: var(--line); }
  .info { padding: 10px 12px 14px; }
  .title { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .date { color: var(--muted); font-size: .85rem; margin-top: 4px; }

  .nav { position: absolute; top: 38%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%;
         border: none; background: var(--accent); color: var(--accent-text); font-size: 20px; line-height: 1;
         cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  .nav:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  .nav[disabled] { opacity: .35; cursor: default; }
  .prev { left: -8px; } .next { right: -8px; }

  .dots { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }
  .dot { width: 10px; height: 10px; padding: 0; border-radius: 50%; border: none; background: var(--line); cursor: pointer; }
  .dot[aria-current="true"] { background: var(--accent); }
  .dot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .status { padding: 24px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); width: 100%; }
  .skeleton { flex: 0 0 calc((100% - 32px) / 3); height: 230px; border-radius: var(--radius); background: var(--line); opacity: .5; }
</style>
</head>
<body>
<section class="widget" aria-roledescription="carousel" aria-labelledby="w-title">
  <header>
    <h1 id="w-title">Latest videos</h1>
    <a id="channel-link" href="https://www.youtube.com/@PapoPistola/videos" target="_blank" rel="noopener">Open channel</a>
  </header>
  <div class="stage">
    <button class="nav prev" aria-label="Previous videos" disabled>&#8249;</button>
    <div class="track" id="track" tabindex="0" aria-live="polite"></div>
    <button class="nav next" aria-label="Next videos">&#8250;</button>
  </div>
  <div class="dots" id="dots"></div>
</section>

<script>
  // ---- Settings ----
  const CHANNEL_ID = "UC-16HBu_yQfxZ9MnYOTkArA";   // @PapoPistola
  const MAX_VIDEOS = 5;
  const FEED_URL = "https://www.youtube.com/feeds/videos.xml?channel_id=" + CHANNEL_ID;
  // YouTube's feed has no CORS headers, so a browser can't read it directly.
  // These public proxies are tried in order. For production, swap in your own endpoint.
  const PROXIES = [
    async () => {
      const r = await fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(FEED_URL));
      if (!r.ok) throw new Error("rss2json " + r.status);
      const j = await r.json();
      if (j.status !== "ok") throw new Error("rss2json status");
      return j.items.map(i => ({
        id: (i.guid || "").replace("yt:video:", "") || new URL(i.link).searchParams.get("v"),
        title: i.title, link: i.link, published: i.pubDate.replace(" ", "T") + "Z"
      }));
    },
    async () => {
      const r = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(FEED_URL));
      if (!r.ok) throw new Error("allorigins " + r.status);
      return parseXml(await r.text());
    }
  ];

  const track = document.getElementById("track");
  const dotsEl = document.getElementById("dots");
  const prev = document.querySelector(".prev");
  const next = document.querySelector(".next");

  function parseXml(text) {
    const xml = new DOMParser().parseFromString(text, "application/xml");
    return [...xml.getElementsByTagName("entry")].map(e => {
      const id = e.getElementsByTagName("yt:videoId")[0]?.textContent;
      return {
        id,
        title: e.getElementsByTagName("title")[0]?.textContent,
        link: e.getElementsByTagName("link")[0]?.getAttribute("href") || "https://www.youtube.com/watch?v=" + id,
        published: e.getElementsByTagName("published")[0]?.textContent
      };
    });
  }

  const fmtDate = iso => {
    const d = new Date(iso);
    return isNaN(d) ? "" : d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  };

  function render(videos) {
    track.replaceChildren(); dotsEl.replaceChildren();
    videos = videos.slice(0, MAX_VIDEOS);
    if (!videos.length) return status("No videos found in this feed.");
    videos.forEach((v, i) => {
      const slide = document.createElement("div");
      slide.className = "slide"; slide.setAttribute("role", "group");
      slide.setAttribute("aria-roledescription", "slide");
      slide.setAttribute("aria-label", (i + 1) + " of " + videos.length);
      const a = document.createElement("a");
      a.className = "video"; a.href = v.link; a.target = "_blank"; a.rel = "noopener";
      const img = document.createElement("img");
      img.className = "thumb"; img.loading = "lazy"; img.alt = "";
      img.src = "https://i.ytimg.com/vi/" + v.id + "/mqdefault.jpg";
      const info = document.createElement("div"); info.className = "info";
      const t = document.createElement("div"); t.className = "title"; t.textContent = v.title;
      const d = document.createElement("div"); d.className = "date"; d.textContent = fmtDate(v.published);
      info.append(t, d); a.append(img, info); slide.append(a); track.append(slide);

      const dot = document.createElement("button");
      dot.className = "dot"; dot.setAttribute("aria-label", "Go to video " + (i + 1));
      dot.addEventListener("click", () => goTo(i));
      dotsEl.append(dot);
    });
    update();
  }

  function status(msg) {
    track.replaceChildren(); dotsEl.replaceChildren();
    const s = document.createElement("div"); s.className = "status"; s.textContent = msg; track.append(s);
    prev.disabled = next.disabled = true;
  }

  const slides = () => [...track.querySelectorAll(".slide")];
  function goTo(i) {
    const s = slides()[i]; if (s) track.scrollTo({ left: s.offsetLeft - track.offsetLeft, behavior: "smooth" });
  }
  function step(dir) {
    const s = slides(); if (!s.length) return;
    const w = s[0].getBoundingClientRect().width + 16;
    track.scrollBy({ left: dir * w, behavior: "smooth" });
  }
  function update() {
    const s = slides(); if (!s.length) return;
    const left = track.scrollLeft;
    let cur = 0, best = Infinity;
    s.forEach((el, i) => { const d = Math.abs(el.offsetLeft - track.offsetLeft - left); if (d < best) { best = d; cur = i; } });
    [...dotsEl.children].forEach((d, i) => d.setAttribute("aria-current", i === cur ? "true" : "false"));
    prev.disabled = left <= 2;
    next.disabled = left + track.clientWidth >= track.scrollWidth - 2;
  }

  prev.addEventListener("click", () => step(-1));
  next.addEventListener("click", () => step(1));
  track.addEventListener("scroll", () => requestAnimationFrame(update), { passive: true });
  window.addEventListener("resize", update);
  track.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
    if (e.key === "ArrowLeft")  { e.preventDefault(); step(-1); }
  });

  async function load() {
    for (let i = 0; i < 3; i++) { const s = document.createElement("div"); s.className = "skeleton"; track.append(s); }
    for (const proxy of PROXIES) {
      try { render(await proxy()); return; } catch (e) { console.warn(e); }
    }
    status("Couldn't load videos. Check your connection or open the channel directly.");
  }
  load();
</script>
</body>
</html>
