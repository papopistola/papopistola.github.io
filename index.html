<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tour Dates Test Site</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #fff; color: #111; }
  header { background: #000; color: #fff; padding: 24px 20px; text-align: center; }
  header h1 { margin: 0; font-size: 1.6rem; }
  main { padding: 32px 20px 64px; }
  h2 { text-align: center; margin: 0 0 24px; }
  footer { text-align: center; color: #777; font-size: .85rem; padding: 20px; border-top: 1px solid #eee; }
</style>
</head>
<body>

<header><h1>Test Site</h1></header>

<main>
  <h2>Tour Dates</h2>

  <!-- ===== START: paste-in widget ===== -->

  <div id="tour-dates-container" class="tour-dates-grid">Loading upcoming tour dates...</div>

  <style>
    .tour-dates-grid { display: flex; flex-direction: column; gap: 20px; font-family: sans-serif; max-width: 800px; margin: 0 auto; }
    .tour-row { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #ccc; padding: 15px 0; gap: 20px; }
    .poster-img { width: 60px; height: 80px; object-fit: cover; border-radius: 4px; background-color: #f0f0f0; }
    .tour-info { flex-grow: 1; }
    .tour-date { font-weight: bold; font-size: 1.1em; }
    .tour-show { margin-top: 4px; font-size: 1.05em; }
    .tour-location { color: #555; margin-top: 4px; }
    .ticket-btn { background-color: #000; color: #fff; padding: 10px 20px; text-decoration: none; text-transform: uppercase; font-weight: bold; font-size: 0.9em; border-radius: 4px; }
    .ticket-btn:hover { background-color: #444; }
    .ticket-spacer { width: 100px; }
  </style>

  <script>
    const SPREADSHEET_ID = '1V5YNdBn7CiriwUIamR57OBRN1QiEdhA7l8iFIH0bkfI';
    const GID = '0';

    // OPTIONAL but recommended: paste the link from File > Share > Publish to web (CSV format).
    // It returns every cell exactly as displayed, including words in the date column.
    const PUBLISHED_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT8u6OtojKkyHxTVR18zFMEBt5SVwpxNq7vRspENH2pRWUDIm9CkDLgBy4Uki5IzOLNzbJ7XKjrOOft/pub?output=csv';

    const PLACEHOLDER_IMG =
      "data:image/svg+xml;utf8," +
      encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="60" height="80"><rect width="60" height="80" fill="#e5e5e5"/></svg>');

    const container = document.getElementById('tour-dates-container');
    let loaded = false;

    function escapeHTML(str) {
      return String(str == null ? '' : str).replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    // rows = array of [date, show, location, venue, ticketLink, posterUrl] (columns A-F, all strings)
    function renderRows(rows) {
      loaded = true;
      let html = '';
      rows.forEach(([date, show, location, venue, ticketLink, posterUrl]) => {
        date = (date || '').trim(); show = (show || '').trim(); location = (location || '').trim(); venue = (venue || '').trim();
        ticketLink = (ticketLink || '').trim(); posterUrl = (posterUrl || '').trim();

        // Skip only completely empty rows (a row with words in any column still shows)
        if (!date && !show && !location && !venue && !ticketLink && !posterUrl) return;

        const hasTickets = ticketLink.startsWith('http');
        const buttonHTML = hasTickets
          ? `<a href="${escapeHTML(ticketLink)}" target="_blank" rel="noopener" class="ticket-btn">Boletos</a>`
          : `<div class="ticket-spacer"></div>`;
        const imgSource = posterUrl.startsWith('http') ? escapeHTML(posterUrl) : PLACEHOLDER_IMG;

        html += `
          <div class="tour-row">
            <img src="${imgSource}" class="poster-img" alt="Show Poster">
            <div class="tour-info">
              <div class="tour-date">${escapeHTML(date)}</div>
              ${show ? `<div class="tour-show">${escapeHTML(show)}</div>` : ''}
              <div class="tour-location">${escapeHTML(venue)}${venue && location ? ' — ' : ''}${escapeHTML(location)}</div>
            </div>
            ${buttonHTML}
          </div>`;
      });
      container.innerHTML = html || 'No upcoming tour dates.';
    }

    function fail(msg) {
      container.innerText = msg || 'Failed to load tour dates.';
    }

    /* ---------- Option A: published CSV (shows every word in the date column) ---------- */
    function parseCSV(text) {
      const out = [];
      let row = [], cell = '', inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
          if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
          else if (c === '"') inQuotes = false;
          else cell += c;
        } else if (c === '"') inQuotes = true;
        else if (c === ',') { row.push(cell); cell = ''; }
        else if (c === '\n' || c === '\r') {
          if (c === '\r' && text[i + 1] === '\n') i++;
          row.push(cell); out.push(row); row = []; cell = '';
        } else cell += c;
      }
      if (cell !== '' || row.length) { row.push(cell); out.push(row); }
      return out;
    }

    /* ---------- Option B: script-tag loader (no setup, but Google may blank out text
       cells in a date column) ---------- */
    function handleSheetData(response) {
      if (!response || response.status !== 'ok') return fail();
      const cellText = c => (c ? (c.f != null ? c.f : (c.v != null ? c.v : '')) : '').toString();
      renderRows(response.table.rows.map(r => {
        const c = r.c || [];
        return [0, 1, 2, 3, 4, 5].map(i => cellText(c[i]));
      }));
    }

    // Fallback loader: works even when the CSV is blocked, but Google may blank
    // out words in a mostly-date column.
    function loadViaScript() {
      const s = document.createElement('script');
      s.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?gid=${GID}&headers=1&tqx=responseHandler:handleSheetData`;
      s.onerror = () => fail();
      document.body.appendChild(s);
      setTimeout(() => {
        if (!loaded) fail('Failed to load tour dates. Make sure the sheet is shared as "Anyone with the link can view".');
      }, 8000);
    }

    if (PUBLISHED_CSV_URL) {
      fetch(PUBLISHED_CSV_URL)
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(text => renderRows(parseCSV(text).slice(1))) // slice(1) skips the header row
        .catch(err => {
          console.warn('CSV blocked or failed, using fallback loader:', err);
          loadViaScript();
        });
    } else {
      loadViaScript();
    }
  </script>

  <!-- ===== END: paste-in widget ===== -->
</main>

<footer>Test page for the Google Sheets tour dates widget</footer>

</body>
</html>
